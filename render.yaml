services:
  - type: web
    name: talkto
    runtime: node
    repo: https://github.com/1WorldCapture/talkto.git
    branch: main
    plan: 0.5c-512mb
    region: oregon
    numInstances: 1
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build:render
    startCommand: node apps/server/tools/render.mjs --config | exec "$(node --input-type=module --eval "import { createRequire } from 'node:module'; const require = createRequire(new URL('apps/server/tools/render.mjs', import.meta.url)); process.stdout.write(createRequire(require.resolve('miniflare'))('workerd').default)")" serve --binary --experimental --socket-addr=entry=0.0.0.0:$PORT --external-addr=loopback=127.0.0.1:65535 -
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: talkto-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TALKTO_AUTH_PROVIDER
        value: better-auth
      - key: TALKTO_OWNER_EMAILS
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: TALKTO_SIGNAL_KEY
        generateValue: true
      - key: TALKTO_API_KEY_SECRET
        generateValue: true
