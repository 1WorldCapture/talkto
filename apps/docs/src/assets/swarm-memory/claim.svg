<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" width="400" height="330" role="img" aria-labelledby="t">
  <title id="t">A claim_task reply for a task labelled area=payments carries memory: root is AGENTS.md in full, files holds traps/payments.md, and omitted lists the other files with their map lines.</title>
  <style>
    text { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #76797e; }
    .m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .b { font-weight: 600; }
    .a { fill: #4a7ad6; }
    .g { fill: #2f9e6a; }
    .box { fill: none; stroke: #8b8e93; stroke-width: 1; }
    .abox { fill: #4a7ad6; fill-opacity: 0.08; stroke: #4a7ad6; stroke-width: 1; }
    .gbox { fill: #2f9e6a; fill-opacity: 0.08; stroke: #2f9e6a; stroke-width: 1; }
    .dbox { fill: none; stroke: #8b8e93; stroke-width: 1; stroke-dasharray: 4 3; }
    .ln { stroke: #8b8e93; stroke-width: 1; fill: none; }
    .tip { fill: #8b8e93; }
  </style>
  <rect class="box" x="8.5" y="8.5" width="169" height="47"/>
  <text x="20" y="28" class="b">Worker</text>
  <text x="20" y="46" class="m">claim_task</text>
  <line class="ln" x1="178" y1="32.5" x2="214" y2="32.5"/>
  <path class="tip" d="M222 32.5 L214 28.5 L214 36.5 Z"/>
  <rect class="box" x="222.5" y="8.5" width="169" height="47"/>
  <text x="234" y="28" class="m b">T-12</text>
  <text x="234" y="46" class="m">area=payments</text>
  <line class="ln" x1="200.5" y1="56" x2="200.5" y2="78"/>
  <path class="tip" d="M200.5 86 L196.5 78 L204.5 78 Z"/>
  <text x="212" y="76" class="m">reply.memory</text>
  <rect class="box" x="8.5" y="86.5" width="383" height="235"/>
  <rect class="abox" x="20.5" y="98.5" width="359" height="45"/>
  <text x="32" y="117" class="m b a">root</text>
  <text x="32" y="135">AGENTS.md, in full, on every claim</text>
  <rect class="gbox" x="20.5" y="152.5" width="359" height="45"/>
  <text x="32" y="171" class="m b g">files</text>
  <text x="32" y="189"><tspan class="m">traps/payments.md</tspan>: named like the label</text>
  <rect class="dbox" x="20.5" y="206.5" width="359" height="63"/>
  <text x="32" y="225" class="m b">omitted</text>
  <text x="32" y="243">every other file, with its line from the map</text>
  <text x="32" y="261">open one with <tspan class="m">read_memory</tspan></text>
  <text x="32" y="292"><tspan class="m">tokens</tspan>: its size, within the server's budget</text>
  <text x="32" y="310"><tspan class="m">version</tspan>: the commit on main</text>
</svg>
